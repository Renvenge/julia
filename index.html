<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100610">
<title>❤️</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 44%,#361022 0%,#160914 45%,#09050c 85%);color:#ffe5ee;font-family:Georgia,serif;overflow-x:hidden}main{width:100%;text-align:center;padding:0 8px}.heart{position:relative;width:min(94vw,750px,100svh);margin:0 auto;isolation:isolate}svg{display:block;width:100%;overflow:visible}.aura{position:absolute;inset:18%;border-radius:50%;background:#fa296a;filter:blur(65px);opacity:0;animation:aura 7s ease forwards;z-index:-1}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.shape{fill:transparent;stroke:url(#rose);stroke-width:1.5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 7px #ff377b);animation:draw 3.6s 1s cubic-bezier(.3,0,.2,1) forwards,fill 2s 3s forwards}@keyframes draw{to{stroke-dashoffset:0}}@keyframes fill{to{fill:#ff377b0e}}@keyframes aura{to{opacity:.13}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.shape{stroke-dashoffset:0;fill:#ff377b12}.aura{opacity:.1}}
</style>
</head>
<body>
<main>
<div class="heart" id="heart">
<div class="aura" aria-hidden="true"></div>
<svg viewBox="0 0 600 540" role="img" aria-label="Partículas de luz formam um coração gigante que pulsa suavemente">
<defs><linearGradient id="rose" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd4df"/><stop offset=".45" stop-color="#ff6396"/><stop offset="1" stop-color="#e63371"/></linearGradient></defs>
<g id="pulse"><path id="outline" class="shape" pathLength="1" d="M300 465 C255 428 65 310 65 181 C65 55 222 42 300 146 C378 42 535 55 535 181 C535 310 345 428 300 465Z"/></g>
</svg>
<canvas id="lights" aria-hidden="true"></canvas>
</div>
</main>
<script>
(() => {
const heart=document.getElementById('heart'),canvas=document.getElementById('lights'),ctx=canvas.getContext('2d');
if(!ctx)return;
const outline=document.getElementById('outline'),pulse=document.getElementById('pulse');
const motion=matchMedia('(prefers-reduced-motion: reduce)');
const length=outline.getTotalLength();
let start=performance.now(),frame=0,hiddenAt=0;
const random=(a,b)=>a+Math.random()*(b-a);
const particles=Array.from({length:360},(_,i)=>{
 const point=outline.getPointAtLength(length*i/360),angle=random(0,Math.PI*2),radius=random(310,480);
 return {x:point.x,y:point.y,sx:300+Math.cos(angle)*radius,sy:270+Math.sin(angle)*radius,delay:random(0,1.5),size:random(.65,1.9),phase:random(0,Math.PI*2),jitter:random(-3,3)};
});
const stars=Array.from({length:38},()=>({x:random(20,580),y:random(25,515),size:random(.4,1.1),phase:random(0,Math.PI*2)}));
function resize(){
 const dpr=Math.min(devicePixelRatio||1,2),width=heart.clientWidth;
 canvas.width=Math.round(width*dpr);canvas.height=Math.round(width*.9*dpr);
 ctx.setTransform(canvas.width/600,0,0,canvas.height/540,0,0);
 if(motion.matches)draw(5,true);
}
function dot(x,y,size,alpha,color){
 ctx.globalAlpha=Math.max(0,Math.min(1,alpha));ctx.fillStyle=color;
 ctx.beginPath();ctx.arc(x,y,size,0,Math.PI*2);ctx.fill();
}
function draw(time,still=false){
 ctx.clearRect(0,0,600,540);
 const formed=Math.max(0,Math.min(1,(time-3.8)/1.2));
 const beat=still?0:Math.pow(Math.max(0,Math.sin((time-4.5)*Math.PI*2/2.8)),12)*.025+Math.pow(Math.max(0,Math.sin((time-4.78)*Math.PI*2/2.8)),18)*.012;
 const scale=1+beat*formed;
 pulse.setAttribute('transform','translate(300 270) scale('+scale+') translate(-300 -270)');
 ctx.globalCompositeOperation='lighter';
 for(const star of stars)dot(star.x,star.y,star.size,.1+(still?.15:(Math.sin(time*.8+star.phase)+1)*.14),'#ffb9d1');
 for(const p of particles){
  const progress=still?1:Math.max(0,Math.min(1,(time-p.delay)/3.2));
  if(!progress)continue;
  const eased=1-Math.pow(1-progress,3),bend=Math.sin(progress*Math.PI)*(1-progress)*65;
  const tx=300+(p.x-300)*scale,ty=270+(p.y-270)*scale;
  const x=p.sx+(tx-p.sx)*eased+Math.sin(p.phase)*bend+p.jitter*eased;
  const y=p.sy+(ty-p.sy)*eased+Math.cos(p.phase)*bend;
  const shimmer=still?.8:.65+.35*Math.sin(time*1.7+p.phase);
  const alpha=Math.min(1,progress*5)*shimmer;
  dot(x,y,p.size*3.5,alpha*.055,'#ff367a');
  dot(x,y,p.size,alpha*.8,'#ff8fb6');
  dot(x,y,p.size*.4,alpha,'#fff0f5');
 }
 // A few soft sparks drift away once the heart has taken shape.
 if(!still&&formed>0){
  for(let i=0;i<16;i++){
   const life=((time-4+i*.39)%5+5)%5/5;
   const p=particles[(i*23)%particles.length];
   dot(p.x+Math.sin(i*2.4)*life*45,p.y-life*65,1.1*(1-life),Math.sin(life*Math.PI)*.45*formed,'#ffc9dc');
  }
 }
 ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}
function tick(now){draw((now-start)/1000);frame=requestAnimationFrame(tick)}
function run(){cancelAnimationFrame(frame);if(motion.matches)draw(5,true);else if(!document.hidden)frame=requestAnimationFrame(tick)}
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){hiddenAt=performance.now();cancelAnimationFrame(frame)}
 else{if(hiddenAt)start+=performance.now()-hiddenAt;hiddenAt=0;run()}
});
motion.addEventListener('change',run);
new ResizeObserver(resize).observe(heart);
resize();run();
})();
</script>
</body></html>
